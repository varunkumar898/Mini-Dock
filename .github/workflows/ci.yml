name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Lint & Host Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Code formatting check
        run: cargo fmt --all -- --check

      - name: Clippy linting (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --all --verbose

  cross-compile-arm64:
    name: Build & Verify ARM64 Musl Binary Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cross-compile for aarch64-unknown-linux-musl
        run: cross build --release --target aarch64-unknown-linux-musl

      - name: Check binary size budget (< 6 MB stripped, < 2 MB M1 skeleton)
        run: |
          BIN="target/aarch64-unknown-linux-musl/release/alphen-box"
          ls -lh "$BIN"
          SIZE_BYTES=$(stat -c%s "$BIN")
          MAX_BYTES=$((2 * 1024 * 1024))
          echo "Binary size: $SIZE_BYTES bytes (budget: $MAX_BYTES bytes)"
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "Binary size exceeded M1 budget!"
            exit 1
          fi
          echo "Size check passed!"
